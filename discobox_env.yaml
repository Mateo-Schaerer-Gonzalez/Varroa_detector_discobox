name: discobox_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python >=3.11
  - numpy>=1.24
  - opencv>=4.7
  - pandas>=2.0
  - matplotlib>=3.7
  - scipy>=1.15         # the log-rank test (scipy.stats.logrank, added in 1.15)
  - openpyxl>=3.1       # pandas needs it to write .xlsx
  - pyyaml>=6.0
  - fastapi>=0.110
  - uvicorn>=0.27
  - pytest>=8.0
  - pyserial>=3.5      # the Discobox fan and LEDs (live runs only)
  - pip
  - pip:
      - python-dotenv
      - optuna>=4.0      # the hyperparameter search of the calibration report
# vmbpy, for the camera, comes with the Vimba X SDK: bash install_linux.sh <VimbaX SDK path>
