[pytest]
pythonpath = .
testpaths = unit_tests
addopts = -p no:cacheprovider
markers =
    slow: runs the analysis on the whole of sample_data (skip with -m "not slow")
# a score that could not be divided by its noise floor (analyzer.NoNoiseWarning, matched by its
# message: naming the class would import the app before conftest.py sets DISCOBOX_CONFIG);
# tests give their frames fake noise
filterwarnings =
    error:The plate round a mite does not vary:UserWarning
