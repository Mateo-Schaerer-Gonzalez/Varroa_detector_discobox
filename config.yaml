mite:
  radius: 8
  motion_threshold: 15.654   
  metric: "max_diff"
  alive_color: [0, 255, 0]          # BGR: Green for alive mites
  dead_color: [0, 0, 255]          # BGR: Red for dead mites

visual_styles:
  rect:
    color: [0, 255, 0]          # BGR: Green default for boxes
    thickness: 2

  text_zone:
    box_color: [0, 255, 0]      # BGR: Blue for zone perimeter
    text_color: [0, 0, 255]     # BGR: Red for label text
    thickness: 2
    font_scale: 1.0
    text_offset_y: 10           # Pixels above the top-left corner


  Zones:
    label_zone:
      box_color: [0, 255, 255]      # BGR: Blue for zone perimeter
      text_color: [0, 255, 255]   # BGR: Yellow for label text
      thickness: 2
      font_scale: 1.0
      text_offset_y: 10           # Pixels above the top-left corner
    mite_zone:
      box_color: [0, 255, 0]      # BGR: Green for zone perimeter
      text_color: [0, 255, 0]     # BGR: Green for label text
      thickness: 2
      font_scale: 1.0
      text_offset_y: 30           # Pixels above the top-left corner

detector:
  min_threshold: 30
  max_threshold: 200
  threshold_step: 10
  filter_by_color: true
  blob_color: 0            # 0 detects dark blobs on light background
  filter_by_area: true
  min_area: 40              
  max_area: 1200            
  filter_by_circularity: true
  min_circularity: 0.55
  filter_by_convexity: true
  min_convexity: 0.80
  filter_by_inertia: true
  min_inertia_ratio: 0.45