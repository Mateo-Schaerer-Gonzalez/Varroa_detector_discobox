mite:
  radius: 8
  metric: "outline_variability"
  # Per metric, the movement threshold on that metric's scale; the one of `metric`
  # is used, so changing `metric` also changes the threshold.
  metric_thresholds: {max_diff: 14.0, mean_diff: 1.727, vector_diff: 117.7, vector_variance: 229.9, variability: 3.476, topN_variability: 3.476, optical_flow: 0.1004, topN_temporal_range: 28.4, topN_vector_temporal_range: 38.5, topN_binary_flux: 0.02296, outline_movement: 0.266, outline_variability: 0.106}
  # Per metric, parameters that override the defaults in classes/scoring/analyzer.py.
  # outline_variability's are always read from this file, never from config.yaml
  # (classes/app_config.py): chosen by scripts/pipeline_optuna.py with the score's constants.
  metric_params: {max_diff: {}, mean_diff: {}, vector_diff: {}, vector_variance: {}, variability: {}, topN_variability: {n: 759}, optical_flow: {window: 5, n: 50, step: 13, winsize: 23, levels: 2, iterations: 2, poly_n: 7, poly_sigma: 1.5, pad: 12}, topN_temporal_range: {n: 10}, topN_vector_temporal_range: {n: 1}, topN_binary_flux: {threshold: 98, n: 260}, outline_movement: {n: 4, pad: 16}, outline_variability: {relative: 0.491, width: 1.04, pad: 16}}
  # Follow the plate when it shakes: each frame is shifted back by the plate's
  # movement before any metric scores it. Changes nothing on a still plate.
  stabilize_plate: true
  # Put the scores of a finished run on one scale for every mite, in the Analysis
  # window (classes/scoring/score_normalizer.py): scaled to the run's typical brightness,
  # and each mite's own floor (the median of its scores) moved to the common one.
  # Tried and saved with the threshold on the calibration report.
  normalize_brightness: false
  normalize_floor: false
  # Per metric, [low, high] on its scale: the shape of the band around its
  # threshold whose scores are too close to call. The result pages widen or
  # narrow it to ask about review_mites mites (classes/results/review_band.py), keeping
  # how far below the threshold it reaches against above it. Saved by the
  # calibration report; a metric left out has a band as far either way.
  metric_review_bands: {}
  # How many mites the result pages ask to check by eye, at the close calls their
  # time of death depends on; 0 for none. A run can have its own number, set on
  # its results page (review_mites in its .settings.txt).
  review_mites: 20
  moving_color: [0, 255, 0]         # BGR: green for a mite moving in the latest recording
  still_color: [0, 0, 255]          # BGR: red for a mite still in the latest recording

visual_styles:
  rect:
    color: [0, 255, 0]          # BGR: Green default for boxes
    thickness: 2

  text_zone:
    box_color: [0, 255, 0]      # BGR: Blue for zone perimeter
    text_color: [0, 0, 255]     # BGR: Red for label text
    thickness: 2
    font_scale: 1.0
    text_offset_y: 10           # Pixels above the top-left corner


  Zones:
    label_zone:
      box_color: [0, 255, 255]      # BGR: Blue for zone perimeter
      text_color: [0, 255, 255]   # BGR: Yellow for label text
      thickness: 2
      font_scale: 1.0
      text_offset_y: 10           # Pixels above the top-left corner
    mite_zone:
      box_color: [0, 255, 0]      # BGR: Green for zone perimeter
      text_color: [0, 255, 0]     # BGR: Green for label text
      thickness: 2
      font_scale: 0.8
      text_offset_y: 30           # Pixels above the top-left corner

detector:
  min_threshold: 30
  max_threshold: 200
  threshold_step: 10
  filter_by_color: true
  blob_color: 0            # 0 detects dark blobs on light background
  filter_by_area: true
  min_area: 40              
  max_area: 1200            
  filter_by_circularity: true
  min_circularity: 0.55
  filter_by_convexity: true
  min_convexity: 0.80
  filter_by_inertia: true
  min_inertia_ratio: 0.45

# The names written beside the plates are read by Google Gemini and filled in on
# the label page (classes/plate/label_reader.py). It needs the internet and a free API
# key, as GEMINI_API_KEY=... in the file .env in this folder.
label_reader:
  enabled: false                 # the label page's box "Read the names from the plates"; ticking it saves it here
  model: "gemini-flash-lite-latest"
